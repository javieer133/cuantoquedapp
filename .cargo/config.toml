# Windows: put the C runtime inside the .exe, so it runs on a clean Windows without the
# Visual C++ Redistributable (no "VCRUNTIME140.dll was not found"). Only for this target.
# A RUSTFLAGS variable replaces this setting: scripts/build-windows.ps1 repeats the flag.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
