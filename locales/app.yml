# ---- Command line ----
cli.usage_tray:
  es: "Uso: cuantoquedapp [--folder <ruta>]\nMuestra el ícono en la barra de menú. Para la consola: cuantoquedapp-cli."
  en: "Usage: cuantoquedapp [--folder <path>]\nShows the menu bar icon. For the terminal: cuantoquedapp-cli."
cli.usage_cli:
  es: "Uso: cuantoquedapp-cli [--folder <ruta>] [--now <RFC3339>] [--live]\n--live: además de los archivos, consulta Codex y Claude en vivo (como el ícono); no se combina con --now."
  en: "Usage: cuantoquedapp-cli [--folder <path>] [--now <RFC3339>] [--live]\n--live: besides the files, asks Codex and Claude live (like the icon); cannot be combined with --now."
cli.use_cli:
  es: "Para la consola usa cuantoquedapp-cli."
  en: "For the terminal, use cuantoquedapp-cli."
cli.missing_folder:
  es: "Falta la ruta de --folder"
  en: "Missing the path after --folder"
cli.missing_now:
  es: "Falta la fecha de --now"
  en: "Missing the date after --now"
cli.bad_now:
  es: "--now requiere una fecha RFC3339 con zona horaria"
  en: "--now needs an RFC3339 date with a time zone"
cli.unknown:
  es: "Argumento desconocido o repetido: %{arg}"
  en: "Unknown or repeated argument: %{arg}"
cli.live_and_now:
  es: "--live no se combina con --now (el dato en vivo es de ahora)"
  en: "--live cannot be combined with --now (live data is from now)"
cli.no_home:
  es: "No pude localizar tu carpeta personal; usa --folder <ruta>"
  en: "Could not find your home folder; use --folder <path>"
